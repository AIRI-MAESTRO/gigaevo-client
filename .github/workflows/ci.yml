name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  # Allow other workflows (e.g. mirror.yml) to gate on lint + tests by
  # calling this workflow as a reusable job.
  workflow_call:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint + tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          # uv.lock is .gitignored (absent in CI), so the default
          # `**/uv.lock` cache key matches nothing and setup-uv errors.
          # Key the cache on pyproject.toml instead.
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Sync dev dependencies
        run: uv sync --extra dev

      - name: Run ruff
        run: uv run ruff check .

      - name: Run pytest
        run: uv run --extra dev pytest -q --maxfail=1
